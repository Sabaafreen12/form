<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    

    


</head>
<body>
    <div class="container mb-5">
        <h2  class="text-center mb-4">Admission Form</h2>
        
        <form class="row g-3 p-4 shadow-lg bg-light">
            <div class="col-md-6">
                <label class="form-label">Student Name</label>
                    <input type="text" placeholder="enter your name" required class="form-control "><br>

                
            </div>
            
            <div  class="col-md-6">
                <lable class="form-label">Phone number</lable>
                <input type="number" placeholder="phone number" required class="form-control"><br>
            </div>
            <div class="col-md-6">
                <label for="course" class="form-label">Select Course</label>
                <select id="course" class="form-select" required>
                    <option value="" disabled selected>Choose your course</option>
                    <option value="html-css">HTML & CSS</option>
                    <option value="java">Java Programming</option>
                    <option value="ethical-hacking">Ethical Hacking</option>
                    <option value="full-stack">Full Stack Web Development</option>
                </select><br>
            </div>
            <div class="col-md-6">
                <lable class="form-label">Email-address</lable>
                <input type="text" placeholder="Email-address" required class="form-control"><br>
            </div>
            <div  class="col-md-6">
                <lable class="form-label">Date Of birth</lable>
                <input type="date"placeholder="date"size" required class="form-control"><br>
            </div>
            <div>
                <lable class="form-label">Address</lable>
                <input type="text" placeholder="Address" required class="form-control"><br>
            </div>
           
            <div class="col-md-12 text-center">
            <button type="button" class="btn-primary btn-lg">Submit Application</button>
            </div>
        </form>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    
</body>
</html>
